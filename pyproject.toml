[project]
name = "odvs"
version = "0.1.0"
description = ""
authors = [
    {name = "Jah-Wilson Teeba",email = "therealjwil07@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0.0"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "boto3 (>=1.43.7,<2.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pyiceberg (>=0.11.1,<0.12.0)",
    "streamlit (>=1.57.0,<2.0.0)",
    "pyspark (>=4.1.1,<5.0.0)",
    "plotly (>=6.7.0,<7.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "botocore (>=1.43.8,<2.0.0)",
    "s3transfer (>=0.17.0,<0.18.0)",
    "fastparquet (>=2026.3.0,<2027.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "structlog (>=25.5.0,<26.0.0)",
]

[tool.poetry]
packages = [{include = "odvs", from = "src"}]

[[tool.poetry.source]]
name = "safety"
url = "https://pkgs.safetycli.com/repository/student-d6337/pypi/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
